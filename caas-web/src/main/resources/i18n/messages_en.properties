# About page
about.title=About XMPP Compliance Tester | {0}
about.heading=About XMPP Compliance Tester
about.intro=This is a web service for checking and visualising compliance status of XMPP servers, with XEPs (XMPP Extension Protocols), made as a part of <a href="https://summerofcode.withgoogle.com/projects/5341326460059648">Google Summer of Code 2018</a> for Conversations.im by <a href="https://rishiraj.me">Rishi Raj</a>. The code for this website, along with a command line tool to check compliance of your server locally, is available under a BSD-3 License on <a href="https://codeberg.org/iNPUTmice/caas">Codeberg</a>. If you want to contribute to the project, read our <a href="https://codeberg.org/iNPUTmice/caas/src/branch/master/CONTRIBUTING.md">contributing guide</a>.
about.why.heading=Why compliance?
about.why.intro=XMPP is an extensible and living standard. Requirements shift over time and thus new extensions (called XEPs) get developed. While server implementors usually react quite fast and are able to cater to those needs it's the server operators who don't upgrade to the latest version or don't enable certain features.
about.why.users_heading=For users:
about.why.users=As a user, it is not easy to choose a good XMPP server for creating a Jabber ID. Using this web service you can choose a good quality server by comparing the servers which have implemented the latest specifications and which servers have been fast at implementing new specifications historically.
about.why.admins_heading=For server admins:
about.why.admins=Picking the right extensions to implement or enable isn't always easy. For this reason the XSF has published <a href="https://xmpp.org/extensions/xep-0387.html">XEP-0387 XMPP Compliance Suites 2018</a> listing the most important extensions to date. This app won't just help you to assess if your server supports those compliance profiles (and more), but also give you some instructions on how to implement the profiles which are currently not supported.
about.features.heading=Features
about.features.1=Tests servers regularly for compliance with XEPs.
about.features.2=Sends alerts to subscribers about invalid credentials, errors occurring while running tests and changes in results for servers.
about.features.3=Generates badges showing the compliance of servers with XEPs.
about.features.4=Helps server admins/maintainers get the right configuration for their servers by giving them information on passing failed tests.
about.features.5=Allows users to explore historical compliance for servers and tests by clicking their links and clicking points on graphs.

