# About page
about.title=О проекте XMPP Compliance Tester | {0}
about.heading=О проекте XMPP Compliance Tester
about.intro=Это веб-сервис для проверки и визуализации соответствия XMPP-серверов расширениям XEP (XMPP Extension Protocols), сделанный в рамках <a href="https://summerofcode.withgoogle.com/projects/5341326460059648">Google Summer of Code 2018</a> для Conversations.im, автор — <a href="https://rishiraj.me">Rishi Raj</a>. Исходный код сайта и консольная утилита для локальной проверки доступны под лицензией BSD-3 на <a href="https://codeberg.org/iNPUTmice/caas">Codeberg</a>. Если вы хотите участвовать в разработке, прочитайте <a href="https://codeberg.org/iNPUTmice/caas/src/branch/master/CONTRIBUTING.md">руководство для контрибьюторов</a>.
about.why.heading=Зачем нужна проверка соответствия?
about.why.intro=XMPP — расширяемый и живой стандарт. Требования меняются со временем, и появляются новые расширения (XEP). Разработчики серверов обычно реагируют быстро и добавляют поддержку новых функций, но операторы серверов часто не обновляются до последних версий или не включают определённые возможности.
about.why.users_heading=Для пользователей:
about.why.users=Обычному пользователю сложно выбрать качественный XMPP-сервер для нового Jabber ID. С помощью этого сервиса вы можете сравнить серверы по тому, какие современные спецификации они поддерживают и насколько быстро они внедряли новые спецификации в прошлом.
about.why.admins_heading=Для администраторов серверов:
about.why.admins=Выбрать нужные расширения для реализации и включения — не всегда просто. Поэтому XSF опубликовал <a href="https://xmpp.org/extensions/xep-0387.html">XEP-0387 «XMPP Compliance Suites 2018»</a> со списком важнейших расширений на сегодняшний день. Этот сервис помогает не только оценить, поддерживает ли ваш сервер нужные профили, но и даёт рекомендации, как реализовать те, что пока не поддерживаются.
about.features.heading=Возможности
about.features.1=Регулярно тестирует серверы на соответствие XEP.
about.features.2=Отправляет подписчикам уведомления о невалидных учётных данных, ошибках при запуске тестов и изменениях в результатах серверов.
about.features.3=Генерирует бейджи, показывающие степень соответствия серверов XEP.
about.features.4=Помогает администраторам правильно настроить серверы, давая рекомендации по прохождению проваленных тестов.
about.features.5=Позволяет пользователям исследовать историю соответствия серверов и тестов по ссылкам и точкам на графиках.

